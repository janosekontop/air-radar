[platformio]
default_envs = waveshare_lcd_1_3

[env:waveshare_lcd_1_3]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts = pre:tools/build_privacy.py

; Waveshare ESP32-S3R8: 16 MB quad flash, 8 MB octal PSRAM.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.partitions = default_16MB.csv
board_build.embed_files = data/x509_crt_bundle
board_build.embed_txtfiles =
    data/setup.html
    data/route_ca.pem
board_upload.flash_size = 16MB
board_upload.maximum_size = 6553600

lib_deps =
    bodmer/TFT_eSPI@2.5.43
    lvgl/lvgl@8.4.0
    bblanchon/ArduinoJson@6.21.5
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DUSER_SETUP_LOADED=1
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    -include include/tft_setup.h

; The onboard USB socket uses a CH343 UART bridge.
upload_speed = 460800
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
